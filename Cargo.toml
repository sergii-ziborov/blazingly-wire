[package]
name = "blazingly-wire"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Framework-independent HTTP/1 parsing, framing, and response encoding built only on httparse"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sergii-ziborov/blazingly-wire"
documentation = "https://docs.rs/blazingly-wire"
keywords = ["http", "http1", "parser", "sans-io", "protocol"]
categories = ["network-programming", "parser-implementations", "web-programming"]

[dependencies]
httparse = "1.10"

[dev-dependencies]
criterion = "0.8.2"
httpdate = "1.0.3"

[[example]]
name = "standalone_server"
path = "examples/standalone_server.rs"

[[bench]]
name = "response_head"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
